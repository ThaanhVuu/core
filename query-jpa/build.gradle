plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    // implementation: service tự khai báo kernel:query để dùng PageResult, SearchQuery...
    implementation project(':query')

    // compileOnly: chỉ dùng lúc biên dịch, không ép version lên service.
    compileOnly platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework.data:spring-data-jpa'
    compileOnly 'jakarta.persistence:jakarta.persistence-api'
    compileOnly 'org.jspecify:jspecify'

    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure'
    testImplementation 'org.springframework.data:spring-data-jpa'
    testImplementation 'jakarta.persistence:jakarta.persistence-api'
    testImplementation 'org.jspecify:jspecify'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

dependencies {
    testImplementation 'org.hibernate.orm:hibernate-core'
    testRuntimeOnly 'com.h2database:h2'
}
